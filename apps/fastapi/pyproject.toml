[project]
name = "coelho-llm-rotator-fastapi"
version = "1.0.0"
description = "COELHO LLM Rotator - FastAPI"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "python-dotenv>=1.0,<2.0",
    "httpx>=0.27,<1.0",
    "redis>=5.0,<7.0",
    "numpy>=1.26,<2.2",
    "rapidfuzz>=3.0,<4.0",
    "json-repair>=0.30,<1.0",
    "river>=0.21,<1.0",
    "litellm==1.83.13",
    "langchain-litellm==0.6.4",
    "langchain-openai>=1.1,<2.0",
    "langchain-core>=1.4,<2.0",
    "beautifulsoup4>=4.12,<5.0",
    "lxml>=5.0,<7.0",
    "pandas>=2.2,<3.0",
    "pyarrow>=15.0,<22.0",
    "huggingface-hub>=0.24,<1.0",
]

[tool.uv]
override-dependencies = [
    "unclecode-litellm; python_version >= '99'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "domains"]

[dependency-groups]
dev = [
    "pyflakes>=3.2,<4.0",
]
