name: Helm chart release (GHCR OCI)

# Packages k8s/helm and pushes it to oci://ghcr.io/rafaelcoelho1409/charts whenever
# Chart.yaml's `version:` isn't already published there. Checked against the
# registry itself (not git history) — GHCR OCI tags are immutable, so this is
# also what makes the job safe to retry after a failed run: a fix-only commit
# that doesn't touch Chart.yaml still republishes the still-missing version,
# which a "did the version field change since the last commit" diff cannot do.
on:
  push:
    branches: [master]
    paths:
      - "k8s/helm/**"
      - ".github/workflows/helm-release.yml"

permissions:
  contents: read
  packages: write

env:
  CHART_DIR: k8s/helm
  OCI_REGISTRY: oci://ghcr.io/rafaelcoelho1409/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      - name: Check if this version is already published
        id: version
        run: |
          new_version="$(yq -r '.version' "${CHART_DIR}/Chart.yaml")"
          echo "new=${new_version}" >> "$GITHUB_OUTPUT"
          if helm show chart "${OCI_REGISTRY}/coelho-llm-rotator" --version "${new_version}" >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "coelho-llm-rotator ${new_version} is already published — skipping."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "coelho-llm-rotator ${new_version} not found in registry — publishing."
          fi

      - name: Fetch chart dependencies
        # charts/*.tgz is gitignored (regenerated, not committed) — pull it back
        # down so `helm package` has valkey to embed. `dependency build` needs
        # the repo pre-registered via `helm repo add` (which this runner never
        # does); `dependency update` resolves the `repository:` URL in
        # Chart.yaml directly, no pre-registration needed. Safe here since the
        # dependency is pinned to an exact version, not a range.
        if: steps.version.outputs.changed == 'true'
        run: helm dependency update "${CHART_DIR}"

      - name: Package chart
        if: steps.version.outputs.changed == 'true'
        run: helm package "${CHART_DIR}" --destination /tmp/chart-out

      - name: Push chart to GHCR OCI
        if: steps.version.outputs.changed == 'true'
        run: helm push "/tmp/chart-out/coelho-llm-rotator-${{ steps.version.outputs.new }}.tgz" "${OCI_REGISTRY}"

      - name: Summary
        if: steps.version.outputs.changed == 'true'
        run: |
          echo "### Published coelho-llm-rotator ${{ steps.version.outputs.new }}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`oci://ghcr.io/rafaelcoelho1409/charts/coelho-llm-rotator:${{ steps.version.outputs.new }}\`" >> "$GITHUB_STEP_SUMMARY"
