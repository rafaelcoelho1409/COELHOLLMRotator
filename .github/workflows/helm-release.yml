name: Helm chart release (GHCR OCI)

# Packages k8s/helm and pushes it to oci://ghcr.io/rafaelcoelho1409/charts whenever
# Chart.yaml's `version:` field changes on a push to master. Only fires on an actual
# version bump — GHCR OCI tags are immutable, so re-pushing an unchanged version fails,
# and it lets COELHO Nexus's Helm dependency track a real, deliberate release.
on:
  push:
    branches: [master]
    paths:
      - "k8s/helm/**"
      - ".github/workflows/helm-release.yml"

permissions:
  contents: read
  packages: write

env:
  CHART_DIR: k8s/helm
  OCI_REGISTRY: oci://ghcr.io/rafaelcoelho1409/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Detect chart version bump
        id: version
        run: |
          new_version="$(yq -r '.version' "${CHART_DIR}/Chart.yaml")"
          if git show 'HEAD~1:${{ env.CHART_DIR }}/Chart.yaml' > /tmp/prev-chart.yaml 2>/dev/null; then
            old_version="$(yq -r '.version' /tmp/prev-chart.yaml)"
          else
            old_version=""
          fi
          echo "new=${new_version}" >> "$GITHUB_OUTPUT"
          if [ "${new_version}" = "${old_version}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Chart version unchanged (${new_version}) — skipping publish."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Chart version bumped: ${old_version:-<none>} -> ${new_version}"
          fi

      - name: Log in to GHCR
        if: steps.version.outputs.changed == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      - name: Package chart
        if: steps.version.outputs.changed == 'true'
        run: helm package "${CHART_DIR}" --destination /tmp/chart-out

      - name: Push chart to GHCR OCI
        if: steps.version.outputs.changed == 'true'
        run: helm push "/tmp/chart-out/coelho-llm-rotator-${{ steps.version.outputs.new }}.tgz" "${OCI_REGISTRY}"

      - name: Summary
        if: steps.version.outputs.changed == 'true'
        run: |
          echo "### Published coelho-llm-rotator ${{ steps.version.outputs.new }}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`oci://ghcr.io/rafaelcoelho1409/charts/coelho-llm-rotator:${{ steps.version.outputs.new }}\`" >> "$GITHUB_STEP_SUMMARY"
