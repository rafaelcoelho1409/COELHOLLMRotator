environment: production

# Points at the bundled valkey dependency below (same release, same namespace —
# works in every environment this chart is installed into: standalone k3d,
# COELHO Cloud prod, and as a Nexus Helm dependency).
redis:
  host: coelho-llm-rotator-valkey
  port: 6379

# Standalone (single instance, no replication, no persistence — cooldown state
# is transient by design, fine to lose on a restart) internal cache. See
# https://github.com/valkey-io/valkey-helm for the full value schema.
valkey:
  fullnameOverride: coelho-llm-rotator-valkey
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

secretName: coelho-llm-rotator-secret

secretMappings:
  # No REDIS_PASSWORD entry: the bundled valkey above has auth.enabled: false
  # (internal-only cache, no sensitive data). A leftover `redis-password` key
  # in this secret from the old external-Redis design would set a real
  # password env var against a Valkey that expects none, and Valkey rejects
  # AUTH outright when no password is configured — breaking every connection.
  - envName: GROQ_API_KEY
    key: groq-api-key
  - envName: NVIDIA_API_KEY
    key: nvidia-api-key
  - envName: CEREBRAS_API_KEY
    key: cerebras-api-key
  - envName: MISTRAL_API_KEY
    key: mistral-api-key
  - envName: GOOGLE_API_KEY
    key: google-api-key
  - envName: DEEPSEEK_API_KEY
    key: deepseek-api-key
  - envName: SAMBANOVA_API_KEY
    key: sambanova-api-key
  - envName: OPENROUTER_API_KEY
    key: openrouter-api-key
  - envName: HF_TOKEN
    key: hf-token

registry:
  url: localhost:5001
  imagePullSecret: ""

fastapi:
  image: localhost:5001/coelho-llm-rotator-fastapi:latest
  imagePullPolicy: Always
  replicas: 1
  resources:
    requests:
      memory: "512Mi"
      cpu: "200m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  portsSettings:
    ports:
      - name: http
        port: 8000
        targetPort: 8000
        nodePort: 30020
        protocol: TCP
    type: LoadBalancer
  startupProbeSettings:
    startupProbe:
      httpGet:
        path: /health
        port: 8000
      failureThreshold: 30
      periodSeconds: 10
  livenessProbeSettings:
    livenessProbe:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 0
      periodSeconds: 15
      failureThreshold: 3
  readinessProbeSettings:
    readinessProbe:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 0
      periodSeconds: 5
      failureThreshold: 3
