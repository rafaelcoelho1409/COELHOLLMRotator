apiVersion: v2
name: coelho-llm-rotator
description: COELHO LLM Rotator
type: application
version: 1.1.1
appVersion: "1.1.1"


dependencies:
  # Bundled internal cache for cross-process provider-cooldown state (see
  # domains/llm/rotator/status/service.py). BSD-3-Clause, Linux Foundation,
  # wire-compatible with the redis-py client already used here. Deployed as
  # part of THIS chart (standalone, single instance, no persistence) so the
  # feature works identically in every environment this chart is installed
  # into, without depending on a shared/external Redis that may not be
  # reachable from every cluster context (e.g. the standalone k3d cluster).
  - name: valkey
    version: "0.12.0"
    repository: "https://valkey.io/valkey-helm/"
