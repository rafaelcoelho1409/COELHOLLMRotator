# =============================================================================
# ARGOCD IMAGE UPDATER CR - COELHO LLM Rotator (PROD — COELHO LLM Rotator standalone k3d)
# =============================================================================
# SCOPE: pairs with application.yaml. Images are built and pushed to
#   coelho-llm-rotator-registry:5000 via `skaffold build --push
#   --default-repo=coelho-llm-rotator-registry:5000`. Image Updater polls that
#   registry every 2 minutes (digest strategy) and patches the Application
#   when a new digest is detected, triggering a rollout.
#
# Apply:
#   kubectl apply -f k8s/argocd/prod/
#
# Flow: skaffold build → coelho-llm-rotator-registry:5000 → Image Updater
#   detects new digest → patches Application → ArgoCD reconciles → rollout.
# =============================================================================
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: coelho-llm-rotator
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: coelho-llm-rotator
      images:
        - alias: fastapi
          imageName: coelho-llm-rotator-registry:5000/coelho-llm-rotator-fastapi:latest
          commonUpdateSettings:
            updateStrategy: digest
          manifestTargets:
            helm:
              spec: fastapi.image
  writeBackConfig:
    method: argocd
